[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "station-agent"
version = "0.1.0"
description = "OE5XRX Station Agent — remote management for amateur radio stations"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "OE5XRX" }]
dependencies = [
    "requests>=2.32,<3.0",
    "PyYAML>=6.0,<7.0",
    "cryptography>=46.0,<47.0",
    "websockets>=14.0,<15.0",
]

[project.urls]
Homepage = "https://github.com/OE5XRX/station-manager"

# Flat layout: package files live next to pyproject.toml (not in a subdir).
# Map the package name "station_agent" to "." so setuptools finds __init__.py here.
# NOTE: this is an EXPLICIT package list — every subpackage MUST be listed here or it is
# silently dropped from the installed wheel/image (works in editable/source dev, but
# `python -m station_agent selftest audio` then fails with ModuleNotFoundError on-target).
# station_agent.audio (the Session B audio engine) was exactly such a miss — caught by
# the Session E QEMU E2E gate. Add every new subpackage here + its package-dir mapping.
[tool.setuptools]
packages = ["station_agent", "station_agent.audio"]
package-dir = { "station_agent" = ".", "station_agent.audio" = "audio" }

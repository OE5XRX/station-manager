server_url: https://ham.oe5xrx.org

# Authentication: Ed25519 signature (required)
station_id: 1
ed25519_key_path: /etc/stationagent/device_key.pem

heartbeat_interval: 60
ota_check_interval: 5  # check for updates every N heartbeats
download_dir: /tmp/station-agent
log_level: INFO

# Remote terminal (Web Shell)
terminal_enabled: false
terminal_shell: /bin/sh

# Bootloader for A/B partition management.
# "auto" detects grub-editenv or fw_setenv at runtime.
# Explicit: "grub" (x64 dev/test) or "uboot" (RPi CM4 production).
bootloader: auto

# Module slot discovery (D2). Scans slot_dev_base for slotN/control and reports
# the described module inventory in the heartbeat. Disable on stations with no modules.
slot_discovery_enabled: true
slot_dev_base: /dev/oe5xrx

# Persistent control channel (D3 agent broker). Off by default.
control_enabled: false
# PTT dead-man: auto-unkey if no keepalive within this many seconds.
control_dead_man_timeout: 1.5
# Whole-command slot round-trip budget (s). Must exceed the module's worst-case
# firmware timeout (SA818 AT ~2 s) so a real device error surfaces as itself,
# not a generic timeout; keep below the server command timeout (10 s).
slot_command_timeout: 5.0
# Telemetry subscription: default poll interval and the hard floor (ms).
telemetry_default_interval_ms: 1000
telemetry_min_floor_ms: 200

# Audio subsystem (Session B). Off by default; needs the audio-capable image
# (PipeWire + WirePlumber + GStreamer). Streams FM RX to the browser and injects
# the browser mic into the module TX over the audio-WebSocket. When enabled together
# with control_enabled, the audio-router appears as a virtual control-plane module.
audio_enabled: false
audio_rx_rate: 8000    # FM module native (8 kHz NB)
audio_mic_rate: 16000  # operator mic uplink (16 kHz WB)
audio_udp_port_base: 47000  # loopback UDP ports for the gst-launch <-> agent bridge
audio_dead_man_timeout: 1.5  # tear down mic→TX if no mic media within this many seconds
audio_router_slot: 1000  # synthetic control-plane slot for the audio-router module

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting
        run: ruff check .

      - name: Check Django template comments
        # Django's {# … #} is single-line only. Multi-line versions
        # render as raw text on the page — bitten the project twice
        # in prod (PR #61, PR #65). Stdlib-only script, no deps.
        run: python scripts/check_template_comments.py

  deps:
    name: Deps lock in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          # Pin uv so the drift check is reproducible: a uv upgrade can change
          # resolver/formatting output and make this job fail even when no
          # requirements/*.in changed. Bump in lockstep with the version used
          # to (re)generate requirements/*.txt.
          version: "0.10.10"

      - name: Recompile lockfiles from *.in
        # uv prefers the versions already pinned in the -o target, so this
        # only re-resolves when a requirements/*.in changed. It does NOT
        # chase new upstream releases (that is a deliberate --upgrade / a
        # Renovate PR), so the drift check below is stable.
        run: |
          uv pip compile requirements/base.in -o requirements/base.txt --python-version 3.14 --no-strip-extras
          uv pip compile requirements/prod.in -c requirements/base.txt -o requirements/prod.txt --python-version 3.14 --no-strip-extras
          uv pip compile requirements/dev.in -c requirements/base.txt -o requirements/dev.txt --python-version 3.14 --no-strip-extras

      - name: Fail if lockfiles are out of sync with *.in
        run: |
          if ! git diff --exit-code requirements/*.txt; then
            echo "::error::requirements/*.txt are out of sync with requirements/*.in — run the three 'uv pip compile' commands above and commit the result."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/dev.txt', 'requirements/base.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system deps (guestfish for provisioning tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libguestfs-tools linux-image-generic
          # Ubuntu ships kernels with 0600 perms; libguestfs's supermin needs read access.
          # Guard the glob so CI does not fail on runner images where
          # the kernel lives somewhere else (or no file matches).
          for k in /boot/vmlinuz-*; do
            [ -e "$k" ] && sudo chmod +r "$k"
          done

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Run tests
        run: pytest

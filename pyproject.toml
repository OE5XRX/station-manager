[tool.ruff]
target-version = "py313"
line-length = 99
# ruff 0.16 began formatting Python code blocks embedded in Markdown by default,
# which would churn dozens of unrelated docs/ spec/plan files on the ruff bump.
# We only ever ran ruff over Python sources, so keep Markdown out of scope.
extend-exclude = ["*/migrations/*.py", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"config/asgi.py" = ["E402"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]
pythonpath = ["."]

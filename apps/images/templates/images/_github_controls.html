{% load i18n %}
{# Controls re-render with every partial fetch so the Refresh button picks
   up the current show-mode. Loaded by _github_releases_table.html and
   _github_error.html. #}
<div class="row-gap-8" style="padding:12px 16px;border-bottom:1px solid var(--line);">
  <button type="button" class="btn btn-sm"
          hx-get="{% url 'images:gh_partial' %}{% if show == 'all' %}?show=all{% endif %}"
          hx-target="#gh-releases"
          hx-swap="innerHTML">
    {% trans "Refresh" %}
  </button>
  <button type="button" class="btn btn-sm{% if show == 'all' %} btn-primary{% endif %}"
          hx-get="{% url 'images:gh_partial' %}?show=all"
          hx-target="#gh-releases"
          hx-swap="innerHTML"
          {% if show == 'all' %}aria-pressed="true"{% endif %}>
    {% trans "Show all" %}
  </button>
  <button type="button" class="btn btn-sm{% if show != 'all' %} btn-primary{% endif %}"
          hx-get="{% url 'images:gh_partial' %}"
          hx-target="#gh-releases"
          hx-swap="innerHTML"
          {% if show != 'all' %}aria-pressed="true"{% endif %}>
    {% trans "Show newest 10" %}
  </button>
</div>

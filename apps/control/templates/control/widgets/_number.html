{% load i18n %}
{% comment %}
Bounds: MVP reads data-min/data-max (first/last range band) in JS. Multi-band
ranges (cap.ranges with >1 entry) are a future enhancement — not serialized on a
data attribute to avoid a Python-repr vs JSON mismatch that would break JSON.parse.
{% endcomment %}
<div class="cp-widget cp-number"
     data-widget
     data-slot="{{ m.slot }}"
     data-module="{{ m.module_id }}"
     data-cap="{{ cap.name }}"
     data-kind="setting"
     data-type="{{ cap.type }}"
     {% for r in cap.ranges %}{% if forloop.first %}data-min="{{ r.min }}"{% endif %}{% endfor %}
     {% for r in cap.ranges %}{% if forloop.last %}data-max="{{ r.max }}"{% endif %}{% endfor %}
     {% if cap.step %}data-step="{{ cap.step }}"{% endif %}>
  <label class="cp-widget-label" for="cp-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}">
    {{ cap.name }}{% if cap.unit %} <span class="cp-unit">{{ cap.unit }}</span>{% endif %}
  </label>
  <div class="cp-number-row">
    <button type="button" class="cp-step cp-step--dec"
            :disabled="!canControl"
            @click="stepValue('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}',-1)"
            aria-label="{% trans 'Decrease' %} {{ cap.name }}">&#8722;</button>
    <input id="cp-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}"
           class="cp-readout cp-readout--number"
           type="number"
           lang="en"
           inputmode="decimal"
           step="{{ cap.step|default:'any' }}"
           {% for r in cap.ranges %}{% if forloop.first %}min="{{ r.min }}"{% endif %}{% endfor %}
           {% for r in cap.ranges %}{% if forloop.last %}max="{{ r.max }}"{% endif %}{% endfor %}
           :value="displayValue('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')"
           :disabled="!canControl"
           :class="{ 'is-pending': isPending('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}') }"
           @change="setValue('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}', $event.target.value)"
           aria-describedby="cp-err-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}">
    <button type="button" class="cp-step cp-step--inc"
            :disabled="!canControl"
            @click="stepValue('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}',1)"
            aria-label="{% trans 'Increase' %} {{ cap.name }}">&#43;</button>
  </div>
  <span id="cp-err-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}"
        class="cp-widget-error"
        role="alert"
        x-show="errorOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')"
        x-text="errorOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')"></span>
</div>

{% load i18n %}
<div class="cp-widget cp-bool"
     data-widget
     data-slot="{{ m.slot }}"
     data-module="{{ m.module_id }}"
     data-cap="{{ cap.name }}"
     data-kind="setting"
     data-type="bool">
  <label class="cp-widget-label cp-bool-label" for="cp-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}">
    {{ cap.name }}
  </label>
  <button type="button"
          id="cp-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}"
          class="cp-toggle"
          role="switch"
          :aria-checked="String(!!valueOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}'))"
          :disabled="!canControl"
          :class="{
            'cp-toggle--on': valueOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}'),
            'is-pending': isPending('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')
          }"
          @click="setValue('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}', !valueOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}'))"
          aria-describedby="cp-err-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}">
    <span class="cp-toggle-track">
      <span class="cp-toggle-thumb"></span>
    </span>
    <span class="cp-toggle-label"
          x-text="valueOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}') ? '{% trans "ON" %}' : '{% trans "OFF" %}'">
    </span>
  </button>
  <span id="cp-err-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}"
        class="cp-widget-error"
        role="alert"
        x-show="errorOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')"
        x-text="errorOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')"></span>
</div>

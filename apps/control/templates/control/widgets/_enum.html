{% load i18n %}
<div class="cp-widget cp-enum"
     data-widget
     data-slot="{{ m.slot }}"
     data-module="{{ m.module_id }}"
     data-cap="{{ cap.name }}"
     data-kind="setting"
     data-type="enum">
  <label class="cp-widget-label" for="cp-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}">
    {{ cap.name }}{% if cap.unit %} <span class="cp-unit">{{ cap.unit }}</span>{% endif %}
  </label>
  <select id="cp-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}"
          class="cp-readout cp-readout--select"
          :disabled="!canControl"
          :class="{ 'is-pending': isPending('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}') }"
          @change="setValue('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}', $event.target.value)"
          aria-describedby="cp-err-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}">
    {% for v in cap.values %}
    <option value="{{ v }}"
            :selected="valueOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}') === '{{ v }}'">
      {{ v }}
    </option>
    {% endfor %}
  </select>
  <span id="cp-err-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}"
        class="cp-widget-error"
        role="alert"
        x-show="errorOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')"
        x-text="errorOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')"></span>
</div>

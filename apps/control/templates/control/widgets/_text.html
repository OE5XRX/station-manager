{% load i18n %}
<div class="cp-widget cp-text"
     data-widget
     data-slot="{{ m.slot }}"
     data-module="{{ m.module_id }}"
     data-cap="{{ cap.name }}"
     data-kind="{{ cap.kind }}"
     data-type="{{ cap.type }}">
  {% if cap.readonly %}
  {% comment %}Readonly value is a <span> (not labelable) — plain label, no for={% endcomment %}
  <span class="cp-widget-label">
    {{ cap.name }}{% if cap.unit %} <span class="cp-unit">{{ cap.unit }}</span>{% endif %}
  </span>
  <span id="cp-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}"
        class="cp-readout cp-readout--display"
        x-text="displayValue('{{ m.slot|escapejs }}','{{ m.module_id|escapejs }}','{{ cap.name|escapejs }}')">
    &#8212;
  </span>
  {% else %}
  <label class="cp-widget-label" for="cp-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}">
    {{ cap.name }}{% if cap.unit %} <span class="cp-unit">{{ cap.unit }}</span>{% endif %}
  </label>
  <input id="cp-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}"
         class="cp-readout cp-readout--text"
         type="text"
         :value="displayValue('{{ m.slot|escapejs }}','{{ m.module_id|escapejs }}','{{ cap.name|escapejs }}')"
         :disabled="!canOperate('{{ m.slot|escapejs }}','{{ m.module_id|escapejs }}')"
         :class="{ 'is-pending': isPending('{{ m.slot|escapejs }}','{{ m.module_id|escapejs }}','{{ cap.name|escapejs }}') }"
         @change="setValue('{{ m.slot|escapejs }}','{{ m.module_id|escapejs }}','{{ cap.name|escapejs }}', $event.target.value)"
         aria-describedby="cp-err-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}">
  <span id="cp-err-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}"
        class="cp-widget-error"
        role="alert"
        x-show="errorOf('{{ m.slot|escapejs }}','{{ m.module_id|escapejs }}','{{ cap.name|escapejs }}')"
        x-text="errorOf('{{ m.slot|escapejs }}','{{ m.module_id|escapejs }}','{{ cap.name|escapejs }}')"></span>
  {% endif %}
</div>

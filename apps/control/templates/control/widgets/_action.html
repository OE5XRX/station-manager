{% load i18n %}
<div class="cp-widget cp-action"
     data-widget
     data-slot="{{ m.slot }}"
     data-module="{{ m.module_id }}"
     data-cap="{{ cap.name }}"
     data-kind="action"
     data-type="{{ cap.type }}">
  <label class="cp-widget-label">{{ cap.name }}</label>
  <button type="button"
          class="cp-btn cp-btn--action"
          :disabled="!canControl || isPending('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')"
          :class="{ 'is-pending': isPending('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}') }"
          @click="doAction('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')"
          aria-describedby="cp-err-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}">
    <span class="cp-btn-label">{{ cap.name }}</span>
    <span class="cp-btn-spinner" aria-hidden="true"
          x-show="isPending('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')"></span>
  </button>
  <span id="cp-err-{{ m.slot }}-{{ m.module_id }}-{{ cap.name }}"
        class="cp-widget-error"
        role="alert"
        x-show="errorOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')"
        x-text="errorOf('{{ m.slot }}','{{ m.module_id }}','{{ cap.name }}')"></span>
</div>
